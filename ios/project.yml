# XcodeGen-Beschreibung von MinePower.xcodeproj (für CI und Xcode).
#
#   brew install xcodegen && cd ios && xcodegen generate && open MinePower.xcodeproj
#
# Quellen sind dieselben wie für `xtool dev build` (Package.swift):
# Sources/MinePower wird direkt ins App-Ziel übersetzt, MinePowerKit kommt
# als lokales Swift-Paket dazu. Nur Xcode-spezifisches liegt in App/
# (Asset-Katalog mit Icon-Varianten, Datenschutz-Manifest, Entitlements).
name: MinePower
options:
  bundleIdPrefix: de.minepower
  developmentLanguage: de
  deploymentTarget:
    # iOS 17 als Untergrenze: Liquid Glass (iOS 26) ist in Design/Glass.swift
    # gekapselt und fällt darunter auf Material zurück.
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MinePowerKit:
    path: MinePowerKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    MARKETING_VERSION: "1.0.0"
    # CI setzt die Build-Nummer aus der Git-Historie (`git rev-list --count HEAD`).
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MinePower:
    type: application
    platform: iOS
    sources:
      - path: Sources/MinePower
      - path: App
        excludes:
          - "IconSource/**"
          - "Icon-1024.png"
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: MinePowerKit
      - target: MinePowerWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: MinePower
        PRODUCT_BUNDLE_IDENTIFIER: de.minepower.app
        INFOPLIST_FILE: App/Info.plist
        # App Group "group.de.minepower.app": geteilter Stand und Token für Widgets.
        CODE_SIGN_ENTITLEMENTS: App/MinePower.entitlements
        # Ergänzt Version und Build-Nummer aus den Build-Einstellungen.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  # Widgets (Home-/Sperrbildschirm) und Live-Aktivität. Teilt Farben, Schrift,
  # Symbole, Logo und den Schlüsselbund-Zugriff mit der App (gleiche Dateien).
  # Lokal ohne Mac prüfen: tools/check-widgets.sh
  MinePowerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Sources/MinePower/Shared
      - path: Sources/MinePower/Design/Theme.swift
      - path: Sources/MinePower/Design/Typography.swift
      - path: Sources/MinePower/Design/WebIcon.swift
      - path: Sources/MinePower/Design/WebIconPaths.swift
      - path: Sources/MinePower/Design/BrandMark.swift
      - path: Sources/MinePower/Core/KeychainStore.swift
      - path: Sources/MinePower/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: MinePowerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: MinePowerWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.minepower.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/MinePowerWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  MinePowerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MinePower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.minepower.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MinePower
        CODE_SIGN_STYLE: Automatic

schemes:
  MinePower:
    build:
      targets:
        MinePower: all
        MinePowerWidgets: all
        MinePowerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MinePowerUITests
    archive:
      config: Release
