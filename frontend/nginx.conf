server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Wie im All-in-One-Image (backend/app/main.py)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA-Routing; index.html, Service Worker und Manifest nie ungeprüft aus dem Cache
    location / {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }

    # Dateinamen mit Inhalts-Hash: dürfen lange gecacht werden
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # WebSocket zum Backend
    location /api/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # REST-API zum Backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
