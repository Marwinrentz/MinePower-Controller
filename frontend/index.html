<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MinePower</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Statusleiste und Browser-Leiste in der Farbe der App, nicht in Grün.
         Hell: iOS-Statusleiste 'default" (dunkle Schrift, Inhalt darunter).
         Dunkel: 'black-translucent" (Inhalt randlos unter der Statusleiste,
         Kopfzeile rückt per safe-area-inset-top unter die Dynamic Island). -->
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MinePower" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem("mp_theme") || localStorage.getItem("sc_theme") || "system";
          var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = dark ? "#0d1015" : "#f3f5f8";
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark ? "black-translucent" : "default";
        } catch (e) { /* Speicher gesperrt – Standard hell */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
